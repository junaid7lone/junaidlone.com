baseURL = "https://junaid7lone.github.io/junaidlone.com/"
languageCode = "en-us"
title = "Junaid Lone"
theme = "PaperMod"

[pagination]
pagerSize = 10

[params]
defaultTheme = "dark"
disableThemeToggle = false
ShowShareButtons = true
ShowReadingTime = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowWordCount = true
ShowLastMod = true
defaultContentType = "posts"
[[params.socialIcons]]
name = "github"
url = "https://github.com/"

[[params.socialIcons]]
name = "twitter"
url = "https://twitter.com/Mojojojomomo"

[[params.socialIcons]]
name = "email"
url = "mailto:junaid7lone@gmail.com"

[menu]
[[menu.main]]
identifier = "home"
name = "⌂ home"
url = "/"
weight = 1

[[menu.main]]
identifier = "archives"
name = "⟁ archives"
url = "/archives"
weight = 10

[[menu.main]]
identifier = "search"
name = "⌕ search"
url = "/search"
weight = 20

[[menu.main]]
identifier = "categories"
name = "◉ categories"
url = "/categories"
weight = 30

[[menu.main]]
identifier = "tags"
name = "⌗ tags"
url = "/tags"
weight = 40

[outputs]
home = [ "HTML", "RSS", "JSON",]

[params.assets]
disableFingerprinting = false

[params.editURL]
enable = false

[params.homeInfoParams]
Title = "Junaid Lone"
Content = "**AI automation · agents · leverage systems**\n\nI currently work with **HSBC (UK)** via **Greenrich (Scotland)**. Outside work, I’m deep in AI, agents, and automation — building systems that compound, capture signal, and make useful things easier to find.\n\nI also keep a close eye on commits, changes, and everything that moves the machine forward.\n\n**Open to:** automation consulting, AI workflows, content systems, and interesting partnerships.\n"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 3

[params.label]
text = "Junaid Lone"
icon = "/img/avatar.png"

[params.customCSS]
enable = true
files = [ "css/custom.css",]

[services.googleAnalytics]
ID = ""

[markup.highlight]
style = "paraiso-dark"
lineNos = true
lineNumbersInTable = true

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]
linkify = true
