baseURL = 'https://jojo.dev/'
languageCode = 'en-us'
title = 'systematica'
theme = 'stack'

paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  mainSections = ['post']
  featuredImageField = 'image'
  rssFullContent = true

  [params.footer]
    since = 2025
    author = true

  [params.dateFormat]
    default = 'January 2, 2006'
    articles = 'January 2, 2006'

  [params.sidebar]
    compact = false
    emoji = '⚡'
    subtitle = 'random hacks · systems thinking · code & chaos'

  [params.widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
    ]
    page = [
        { type = "toc" },
    ]

  [params.opengraph]
    images = ['icon.png']
    twitterSite = '@Mojojojomomo'
    twitterCreator = '@Mojojojomomo'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '⌂ home'
    url = '/'
    weight = -100

  [[menu.main]]
    identifier = 'archives'
    name = '⟁ archives'
    url = '/archives'
    weight = 90

  [[menu.main]]
    identifier = 'categories'
    name = '◉ categories'
    url = '/categories'
    weight = 100

  [[menu.main]]
    identifier = 'tags'
    name = '⌗ tags'
    url = '/tags'
    weight = 110

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = 'monokai'

  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

  [outputs]
  home = ['HTML', 'RSS']
